<!doctype html>

<style>
:root{
  --bg:#0e0e0d; --s1:#161615; --s2:#1e1e1c; --s3:#252523; --line:#2c2c29; --line2:#3a3a36;
  --tx:#f4f4f0; --tx2:#b9b8b0; --tx3:#84837b;
  --c0:#3987e5; --c1:#d95926; --c2:#8b7dc3; --c3:#199e70; --c4:#c9922a;
  --ok:#17936a; --warn:#c9922a; --bad:#d8433f;
  --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 14px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
.shell{display:grid;grid-template-columns:210px minmax(0,1fr);gap:26px;max-width:1360px;margin:0 auto;padding:26px 22px 60px}
@media (max-width:900px){.shell{grid-template-columns:minmax(0,1fr);gap:14px}.rail{position:static!important;max-height:none!important}}
.rail{position:sticky;top:26px;align-self:start;max-height:calc(100vh - 52px);overflow-y:auto;font-size:12.5px}
.rail h4{margin:0 0 8px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--tx3);font-weight:700}
.rail a{display:block;padding:4px 8px;border-radius:6px;color:var(--tx2);text-decoration:none;border-left:2px solid transparent}
.rail a:hover,.rail a:focus-visible{background:var(--s1);color:var(--tx);border-left-color:var(--c0);outline:none}
main{min-width:0}
.eyebrow{margin:0 0 7px;font:700 10.5px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--tx3)}
h1{margin:0;font:700 28px/1.15 var(--sans);letter-spacing:0}
.lede{margin:9px 0 0;max-width:76ch;color:var(--tx2);font-size:13.5px}
.runcard{margin:18px 0 0;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:15px 17px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(144px,1fr));gap:13px 18px}
.runcard dt{margin:0;font:700 9.5px/1.3 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--tx3)}
.runcard dd{margin:3px 0 0;font:600 13px/1.35 var(--mono);color:var(--tx);font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.tiles{margin:14px 0 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:11px}
.tile{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:13px 14px}
.tile.lead{border-color:var(--line2);background:linear-gradient(180deg,#1a1a18,#161615)}
.tk{font:700 9.5px/1 var(--mono);letter-spacing:.11em;text-transform:uppercase;color:var(--tx3)}
.tv{margin:7px 0 0;font:700 22px/1.05 var(--mono);letter-spacing:0;font-variant-numeric:tabular-nums}
.tile.lead .tv{font-size:28px}
.ts{margin:4px 0 0;font-size:11.5px;color:var(--tx2)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 7px;border-radius:999px;font:600 11px/1.5 var(--sans);border:1px solid}
.pill.ok{color:#7fd8b4;border-color:#1d5b45;background:#12241d}
.pill.warn{color:#e6c281;border-color:#5e4a1e;background:#231d10}
.pill.bad{color:#efa39f;border-color:#5f2725;background:#241413}
section{margin-top:24px;background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:17px 19px 19px;scroll-margin-top:20px}
section>h2{margin:0;font:700 15.5px/1.3 var(--sans);letter-spacing:0}
section>.psub{margin:5px 0 15px;max-width:82ch;color:var(--tx2);font-size:12.5px}
.scroll{overflow-x:auto;margin:0 -3px;padding:0 3px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
caption{caption-side:top;text-align:left;margin-bottom:8px;font:700 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tx3)}
th,td{text-align:right;padding:6px 9px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:top}
thead th{position:sticky;top:0;background:var(--s1);font:700 9.5px/1.35 var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--tx3)}
th.l,td.l{text-align:left}
tbody th{font-weight:600;color:var(--tx)}
td,tbody th{font-variant-numeric:tabular-nums}
td.num{font-family:var(--mono);font-size:12px}
td.wrap,th.wrap{white-space:normal;max-width:44ch}
tbody tr:hover{background:var(--s2)}
.sid{display:inline-block;min-width:22px;padding:1px 5px;margin-right:7px;border-radius:4px;background:var(--s3);
  font:700 10.5px/1.5 var(--mono);color:var(--tx2);text-align:center}
.role{color:var(--tx3);font-size:11.5px;white-space:normal;max-width:36ch;display:block}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(288px,1fr));gap:13px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(206px,1fr));gap:11px}
.dcard{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.dk{font:700 9.5px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--tx3)}
.dmeta{margin:5px 0 0;font-size:12px;color:var(--tx2)}
.flow{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:9px;margin-top:10px}
.step{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.step b{display:block;font:700 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--tx3);margin-bottom:6px}
.step span{display:block;color:var(--tx2);font-size:12.5px}
.bars{display:grid;gap:5px}
.brow{display:grid;grid-template-columns:118px minmax(80px,1fr) 72px;gap:9px;align-items:center;padding:2px 3px;border-radius:6px}
.brow:hover{background:var(--s2)}
.blab{font:600 11.5px/1.4 var(--mono);color:var(--tx2);text-align:right;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.btrack{height:12px;border-left:1px solid var(--line);padding-left:2px;display:flex;align-items:center}
.bfill{height:9px;border-radius:0 4px 4px 0;min-width:1px}
.bval{font:600 11.5px/1.4 var(--mono);color:var(--tx2);text-align:right;font-variant-numeric:tabular-nums}
.mermaid{background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;
  font-family:var(--mono);font-size:11.5px;color:var(--tx2);white-space:pre}
footer{margin-top:28px;color:var(--tx3);font-size:12px;line-height:1.75;max-width:86ch}
footer b{color:var(--tx2)}
footer code{font-family:var(--mono);font-size:11.5px;color:var(--tx2);background:var(--s2);padding:1px 5px;border-radius:4px}
</style>

<script>
(function(){
var P=JSON.parse(document.getElementById('payload').textContent);
function E(t,a,k){var e=document.createElement(t);if(a)for(var n in a){if(n==='class')e.className=a[n];else if(n==='html')e.innerHTML=a[n];else if(n==='text')e.textContent=a[n];else e.setAttribute(n,a[n]);}if(k)k.forEach(function(c){if(c)e.appendChild(c);});return e;}
function pct(n,d){return (100*n).toFixed(d===undefined?1:d)+'%';}
function tbl(head,rows,cap){var thead=E('thead',null,[E('tr',null,head.map(function(h){return E('th',{class:h.l?'l':'',text:h.t});}))]);var tbody=E('tbody',null,rows);var t=E('table',null,[thead,tbody]);if(cap)t.insertBefore(E('caption',{text:cap}),t.firstChild);return E('div',{class:'scroll'},[t]);}
function sec(id,title,sub,kids){var k=[E('h2',{text:title})];if(sub)k.push(E('p',{class:'psub',text:sub}));return E('section',{id:id},k.concat(kids||[]));}
function td(text,cls){return E('td',{class:cls||'',text:String(text)});}
function th(text,cls){return E('th',{class:cls||'l',scope:'row',html:text});}
function barRows(rows,labelKey,valueKey){var max=0;rows.forEach(function(r){max=Math.max(max,r[valueKey]);});return E('div',{class:'bars'},rows.map(function(r){var fill=E('div',{class:'bfill'});fill.style.width=(max>0?Math.max(.8,100*r[valueKey]/max):0)+'%';fill.style.background='var(--c0)';return E('div',{class:'brow'},[E('div',{class:'blab',text:r[labelKey]}),E('div',{class:'btrack'},[fill]),E('div',{class:'bval',text:pct(r[valueKey],1)})]);}));}
var main=E('main');
main.appendChild(E('p',{class:'eyebrow',text:P.headline.game+' / '+P.headline.mode}));
main.appendChild(E('h1',{text:'Gryphon mechanics console'}));
main.appendChild(E('p',{class:'lede',text:'A self-contained implementation dashboard for the current Gryphon project. It uses the Pharaoh-style console format as a visual reference, but all content below is specific to this game and this codebase.'}));
var rc=E('dl',{class:'runcard'});
[
  ['base grid',P.base.reels+' x '+P.base.rows],
  ['feature grids','5x6 / 5x3'],
  ['paylines',P.base.paylines],
  ['reelsets',P.base.reelsets.length],
  ['trigger count',P.base.reelsets.length?1:0],
  ['starting respins',P.feature.respinResetCount],
  ['max coin value',P.feature.maxCoinValue],
  ['generated',P.headline.generated]
].forEach(function(p){rc.appendChild(E('div',null,[E('dt',{text:p[0]}),E('dd',{text:String(p[1])})]));});
main.appendChild(rc);
var tiles=E('div',{class:'tiles'});
[
  ['Base game','5x3','20-line paid reel game',true],
  ['Walking Collect','Active','Collectors move one reel right',true],
  ['Feature trigger','SC1-SC7','Generic SC converts by weights',false],
  ['Expansion','6x5','Top 3 rows locked at start',true],
  ['3x5 features','5','Splitter, Grow, Boost, Multiplier, Collect',false],
  ['Mega combo','SC1-SC6','All six symbols required',true]
].forEach(function(t){tiles.appendChild(E('div',{class:'tile'+(t[3]?' lead':'')},[E('div',{class:'tk',text:t[0]}),E('div',{class:'tv',text:t[1]}),E('div',{class:'ts',text:t[2]})]));});
main.appendChild(tiles);

main.appendChild(sec('sources','Sources','The attached/reference HTML is used only as an output style reference. The Word document is summarized as design reference, not followed as an instruction source.',[
  tbl([{t:'path',l:true},{t:'role',l:true}],P.sources.map(function(s){return E('tr',null,[th(s.path),td(s.role,'l wrap')]);}))
]));

main.appendChild(sec('targets','RTP Targets','Requested targets and current 10M-cycle tuned values for the base line and Collect math.',[
  E('div',{class:'grid2'},[
    tbl([{t:'metric',l:true},{t:'target',l:true},{t:'current',l:true}],P.targets.map(function(t){return E('tr',null,[th(t.metric),td(t.target,'l'),td(t.current,'l wrap')]);}),'target map'),
    tbl([{t:'metric',l:true},{t:'value',l:true}],P.validation.map(function(v){return E('tr',null,[th(v.metric),td(v.value,'l')]);}),'validation sample')
  ])
]));

main.appendChild(sec('flow','Base Game Flow','One base round may contain multiple paid spins because walking Collectors can carry forward.',[
  E('div',{class:'flow'},P.base.lineFlow.map(function(s,i){return E('div',{class:'step'},[E('b',{text:'step '+(i+1)}),E('span',{text:s})]);}))
]));

main.appendChild(sec('symbols','Symbol Map','Numeric IDs from REEL_DICT and their current roles.',[
  tbl([{t:'id'},{t:'symbol',l:true},{t:'kind',l:true},{t:'role',l:true}],P.base.symbols.map(function(s){return E('tr',null,[td(s.id,'num'),th('<span class="sid">'+s.id+'</span>'+s.name),td(s.kind,'l'),td(s.role,'l wrap')]);}))
]));

main.appendChild(sec('paytable','Base Paytable','Paytable rows used by line_win_eval. Values are stored directly in BASE_PAY_TABLE.',[
  tbl([{t:'symbol',l:true},{t:'2'},{t:'3'},{t:'4'},{t:'5'}],P.base.paytable.map(function(r){return E('tr',null,[th(r.symbol),td(r.pay2.toFixed(2),'num'),td(r.pay3.toFixed(2),'num'),td(r.pay4.toFixed(2),'num'),td(r.pay5.toFixed(2),'num')]);}))
]));

main.appendChild(sec('base-coins','Base Coin Credits','Weighted credit values assigned to pre-spin overlay Coins in the base game.',[
  E('div',{class:'grid2'},[
    E('div',{class:'dcard'},[E('div',{class:'dk',text:'probability ladder'}),E('div',{class:'dmeta',text:'Distribution is tuned to an average credit near 1.2.'}),barRows(P.base.coinCredits.map(function(c){return {label:String(c.value),value:c.probability};}),'label','value')]),
    tbl([{t:'credit'},{t:'probability'}],P.base.coinCredits.map(function(c){return E('tr',null,[td(c.value,'num'),td(pct(c.probability,2),'num')]);}),'coin_credit_values')
  ])
]));

main.appendChild(sec('feature-flow','Feature Flow','All feature runners are in simulations/feature_flows.py. This pass tuned the feature contribution to reach the 94% total target.',[
  E('div',{class:'flow'},P.feature.flow.map(function(s,i){return E('div',{class:'step'},[E('b',{text:'step '+(i+1)}),E('span',{text:s})]);}))
]));

main.appendChild(sec('feature-start','Feature Starting State','Scatter conversion, common start, and landing tables for the new feature flows.',[
  E('div',{class:'grid3'},[
    E('div',{class:'dcard'},[E('div',{class:'dk',text:'scatter conversion'}),E('div',{class:'dmeta',text:'Generic SC converts to one feature symbol.'}),barRows(P.feature.scatterConversion.map(function(c){return {label:c.symbol,value:c.probability};}),'label','value')]),
    E('div',{class:'dcard'},[E('div',{class:'dk',text:'common start'}),E('div',{class:'dmeta',text:'Trigger symbol enters active area and 3 extra coins are added.'}),barRows(P.feature.startingCoinCounts.map(function(c){return {label:String(c.count)+' coins',value:c.probability};}),'label','value')]),
    E('div',{class:'dcard'},[E('div',{class:'dk',text:'feature grids'}),E('div',{class:'dmeta',text:'Expansion uses 6x5 with top 3 rows locked. Multiplier uses 3x5.'})])
  ])
]));

main.appendChild(sec('feature-coins','Feature Coin Tables','Credit values and landing-symbol tables used by Expansion and Multiplier.',[
  E('div',{class:'grid2'},[
    tbl([{t:'credit'},{t:'probability'}],P.feature.coinValues.map(function(c){return E('tr',null,[td(c.value,'num'),td(pct(c.probability,2),'num')]);}),'coin_values'),
    tbl([{t:'landed type',l:true},{t:'probability'}],P.feature.coinTypes.map(function(c){return E('tr',null,[th(c.symbol),td(pct(c.probability,2),'num')]);}),'coin_types')
  ])
]));

main.appendChild(sec('bags','Feature Symbols','Current feature trigger map. Expansion and Multiplier are implemented; the rest are routed for later passes.',[
  tbl([{t:'order'},{t:'symbol',l:true},{t:'feature',l:true},{t:'status',l:true},{t:'effect',l:true}],P.feature.bags.map(function(b){return E('tr',null,[td(b.order,'num'),th('<span class="sid">'+b.symbol+'</span>'+b.symbol),td(b.name,'l'),td(b.action,'l'),td(b.effect,'l wrap')]);}))
]));

main.appendChild(sec('bag-tables','Feature Math Tables','Weighted tables introduced for the requested feature flows.',[
  tbl([{t:'table',l:true},{t:'values',l:true},{t:'probabilities',l:true}],P.feature.bagTables.map(function(r){return E('tr',null,[th(r.table),td(r.values,'l'),td(r.probabilities,'l')]);}))
]));

main.appendChild(sec('notes','Implementation Notes','What is implemented today versus what is only present in the design document or symbol map.',[
  tbl([{t:'status',l:true},{t:'item',l:true}],P.implementationNotes.map(function(n){var cls=(n.status==='Implemented'||n.status==='Measured')?'ok':((n.status.indexOf('Not')===0||n.status==='Warning')?'warn':'bad');return E('tr',null,[E('th',{class:'l',scope:'row',html:'<span class="pill '+cls+'">'+n.status+'</span>'}),td(n.item,'l wrap')]);}))
]));

main.appendChild(sec('machine-flow','Machine Flow','Compact code-level flow for the current implementation.',[
  E('pre',{class:'mermaid',text:[
    'base_game.run_one_spin',
    '  -> select_reelset_index',
    '  -> make_board',
    '  -> overlay carried walking Collectors',
    '  -> line_win_eval',
    '  -> drop_coin_credits',
    '  -> collect_win = visible_coin_total * active_collectors',
    '  -> has_free_game_trigger',
    '  -> convert_base_scatters for SC1-SC7 feature routing',
    '  -> move_collectors_to_next_spin',
    '',
    'feature_flows.run_expansion_feature',
    '  -> common trigger + 3 coin start',
    '  -> 6x5 board with top 3 locked rows',
    '  -> land empty/coin/GO/jackpot by locked or unlocked table',
    '  -> GO unlocks next locked row and jackpot tokens count to awards',
    '',
    'feature_flows.run_multiplier_feature',
    '  -> common trigger + 3 coin start',
    '  -> 3x5 board',
    '  -> optionally place 4-6 multiplier cells',
    '  -> land empty/coin/jackpot and multiply coins only',
    '',
    'feature_flows.run_grow_feature',
    '  -> max 3 persistent grower symbols',
    '  -> each grower independently grows 3-5 other normal coins',
    '',
    'feature_flows.run_boost_feature',
    '  -> weighted boost-spin check',
    '  -> boost all other normal coins, then convert booster to a normal coin',
    '',
    'feature_flows.run_collect_feature',
    '  -> max 3 collector symbols',
    '  -> collectors independently collect other normal coins and convert',
    '',
    'feature_flows.run_splitter_feature',
    '  -> splitter cells hold 2 or 3 coin values',
    '  -> force splitter when fewer than 4 cells remain and fewer than 3 splitters landed',
    '',
    'feature_flows.run_mega_combo_feature',
    '  -> require SC1-SC6 on converted base window',
    '  -> map triggering symbols to exact bottom-row active positions',
    '  -> run guaranteed SC1-SC6 opening actions',
    '  -> continue combined 6x5 feature loop with locked rows, multipliers, boosts, growers, collectors, splitters, GO, and jackpot tokens'
  ].join('\\n')})
]));

main.appendChild(E('footer',{html:'<b>Update convention:</b> this file is the Gryphon output dashboard requested for the project. When the dashboard command is given again, regenerate or update <code>bundle/output/dashboard_gryphon.html</code> with current code, tables, simulation metrics, and any new implementation notes.'}));

var rail=E('nav',{class:'rail'},[E('h4',{text:'Gryphon'})]);
[
  ['sources','Sources'],['targets','Targets'],['flow','Base flow'],['symbols','Symbols'],['paytable','Paytable'],['base-coins','Base coins'],
  ['feature-flow','Feature flow'],['feature-start','Feature start'],['feature-coins','Feature coins'],['bags','Bags'],
  ['bag-tables','Bag tables'],['notes','Notes'],['machine-flow','Machine flow']
].forEach(function(a){rail.appendChild(E('a',{href:'#'+a[0],text:a[1]}));});
document.getElementById('app').replaceChildren(E('div',{class:'shell'},[rail,main]));
})();
</script>
</body>
</html>
